      <stop offset="0" stop-color="#1fc4f5"/>
      <stop offset="0.55" stop-color="#0a8ef0"/>
      <stop offset="1" stop-color="#16355c"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#qg)"/>
